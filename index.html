<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeltaVi | Launching Soon</title>
    <meta name="description" content="DeltaVi is under maintenance and launching soon. See the countdown and leave your email to hear when we go live.">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="page">
        <header class="site-header">
            <img src="images/logo.png" class="logo" alt="DeltaVi" width="137" height="42">
        </header>

        <main class="hero">
            <section class="content" aria-labelledby="heroTitle">
                <p class="eyebrow">
                    <span class="status-dot" aria-hidden="true"></span>
                    Website is under maintenance
                </p>
                <h1 id="heroTitle">We're <span>Launching</span> Soon</h1>
                <p class="launch-date" id="launchDate">Counting down to launch day.</p>

                <div class="launch-time" id="countdown" role="timer" aria-label="Time left until launch">
                    <div class="time-box">
                        <p class="time-value" id="days">00</p>
                        <span class="time-label">days</span>
                    </div>
                    <div class="time-box">
                        <p class="time-value" id="hours">00</p>
                        <span class="time-label">hours</span>
                    </div>
                    <div class="time-box">
                        <p class="time-value" id="minutes">00</p>
                        <span class="time-label">minutes</span>
                    </div>
                    <div class="time-box">
                        <p class="time-value" id="seconds">00</p>
                        <span class="time-label">seconds</span>
                    </div>
                </div>

                <form class="notify-form" id="notifyForm" novalidate>
                    <label class="notify-label" for="email">Get an email when we go live</label>
                    <div class="notify-row">
                        <input class="notify-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" aria-describedby="formMessage" required>
                        <button class="notify-button" type="submit">
                            Notify me <img src="images/triangle.png" alt="" width="12" height="14">
                        </button>
                    </div>
                    <p class="form-message" id="formMessage" aria-live="polite"></p>
                </form>
            </section>

            <img src="images/rocket.png" class="rocket" alt="Outline of a rocket taking off" width="391" height="419">
        </main>

        <footer class="site-footer">
            <p>&copy; <span id="year">2026</span> DeltaVi. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
